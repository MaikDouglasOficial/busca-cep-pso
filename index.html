<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Busca CEP - Paraiso-TO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            font-family: 'Roboto', sans-serif;
        }
        html, body {
            overflow-x: hidden;
            max-width: 100vw;
        }
        body {
            position: relative;
        }
        * {
            box-sizing: border-box;
        }
        input, button, textarea, select {
            font-size: 16px !important;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.3s ease-out;
        }
        @media (max-width: 640px) {
            body {
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }
            .mobile-optimized {
                -webkit-tap-highlight-color: transparent;
                touch-action: manipulation;
            }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-green-50 via-white to-green-100 min-h-screen overflow-x-hidden">
    <!-- Contador moderno e discreto -->
    <div class="w-full flex justify-center items-center mt-4 mb-4">
        <div class="flex flex-col items-center">
            <span class="inline-flex items-center gap-2 px-4 py-1 rounded-full bg-gradient-to-r from-green-100 via-white to-green-100 shadow-sm border border-green-200">
                <svg class="w-4 h-4 text-green-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M12 20.5C7.305 20.5 3.5 16.695 3.5 12S7.305 3.5 12 3.5 20.5 7.305 20.5 12 16.695 20.5 12 20.5z"/></svg>
                <span class="text-sm text-green-700 font-medium tracking-wide">Visitas:</span>
                <span id="manualVisitCount" class="text-green-800 font-mono font-bold text-base">1</span>
            </span>
        </div>
    </div>
    <div class="container mx-auto px-3 sm:px-6 py-6 sm:py-12 md:py-16 max-w-3xl rounded-3xl shadow-2xl bg-white/80 backdrop-blur-md border border-green-100">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl sm:text-4xl md:text-5xl font-extrabold text-green-700 mb-2 drop-shadow-lg tracking-tight">
                Busca CEP <span class="text-green-400">Paraíso</span>
            </h1>
            <p class="text-gray-500 text-base sm:text-lg md:text-xl font-medium">Consulta rápida dos novos CEPs de Paraíso do Tocantins - TO</p>
        </div>

        <!-- Search Box -->
        <div class="bg-gradient-to-r from-green-100 via-white to-green-50 rounded-2xl shadow-xl p-4 sm:p-8 mb-6 mobile-optimized border border-green-100">
            <div class="flex flex-col sm:flex-row gap-3">
                <div class="flex-1">
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="Digite o nome da rua ou bairro..."
                        autocomplete="off"
                        autocorrect="off"
                        autocapitalize="off"
                        spellcheck="false"
                        class="w-full max-w-full px-4 py-3 text-base border-2 border-green-200 rounded-xl focus:ring-2 focus:ring-green-400 focus:border-green-400 outline-none transition-all bg-white/80 shadow-inner"
                        style="font-size: 16px;"
                    />
                </div>
                <button 
                    id="clearBtn"
                    class="w-full sm:w-auto px-6 py-3 text-base bg-green-500 text-white rounded-xl hover:bg-green-600 active:bg-green-700 transition-all duration-200 font-semibold shadow-md mobile-optimized"
                >
                    Limpar
                </button>
            </div>
            
            <!-- Results Counter -->
            <div id="resultsCounter" class="mt-3 text-sm text-green-700 font-semibold px-1">
                Aguardando busca...
            </div>
        </div>

        <!-- Results Container -->
        <div id="resultsContainer" class="space-y-3 mb-6">
            <!-- Results will be inserted here -->
        </div>

        <!-- Initial Message -->
        <div id="initialMessage" class="text-center py-16">
            <svg class="mx-auto h-16 w-16 text-green-200 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
            <p class="text-green-400 text-lg font-semibold">Digite para iniciar a busca</p>
        </div>

        <!-- No Results Message -->
        <div id="noResults" class="hidden text-center py-16">
            <svg class="mx-auto h-16 w-16 text-red-200 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
            <p class="text-red-400 text-lg font-semibold">Nenhum resultado encontrado</p>
            <p class="text-gray-400 text-sm mt-2">Tente buscar por outro termo</p>
        </div>
    </div>

    <script src="ceps_paraiso.js"></script>
            <script>
                // Contador manual de visitas iniciando em 1
                const visitKey = 'manualVisitCount';
                let count = localStorage.getItem(visitKey);
                if (!count) {
                    count = 1;
                } else {
                    count = parseInt(count);
                    count++;
                }
                localStorage.setItem(visitKey, count);
                document.getElementById('manualVisitCount').textContent = count;

                // Salva o valor do contador ao subir para o git
                // Sempre que for subir uma atualização, copie o valor mostrado aqui
                document.getElementById('lastVisitCount').textContent = count;
            </script>
        <!-- Firebase SDK -->
        <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script>
        // Contador de visitas global usando Firebase Firestore
        // Substitua os valores abaixo pelas suas configurações do Firebase
        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "SUA_AUTH_DOMAIN",
            projectId: "SUA_PROJECT_ID",
            storageBucket: "SUA_STORAGE_BUCKET",
            messagingSenderId: "SUA_MESSAGING_SENDER_ID",
            appId: "SUA_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const counterDoc = db.collection('contadores').doc('visitas');

        // Incrementa o contador de visitas
        counterDoc.get().then(doc => {
            if (doc.exists) {
                counterDoc.update({ count: firebase.firestore.FieldValue.increment(1) });
            } else {
                counterDoc.set({ count: 1 });
            }
        });

        // Lê o valor atualizado
        counterDoc.onSnapshot(doc => {
            document.getElementById('visitCount').textContent = doc.data().count;
        }, () => {
            document.getElementById('visitCount').textContent = 'Erro';
        });
        // ========================================
        // DADOS - Convertendo do formato do arquivo
        // ========================================
        const cepData = cepsData.map(item => ({
            logradouro: item.Logradouro,
            bairro: item.Bairro,
            cep: item.CEP
        }));

        // ========================================
        // FUNÇÕES DE BUSCA E FILTRO
        // ========================================
        
        // Remove acentos para facilitar a busca
        function removeAccents(str) {
            return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        }

        // Filtra os dados baseado na busca
        function searchCEP(query) {
            if (!query.trim()) {
                return [];
            }

            const normalizedQuery = removeAccents(query.toLowerCase());
            
            const results = cepData.filter(item => {
                const normalizedLogradouro = removeAccents(item.logradouro.toLowerCase());
                const normalizedBairro = removeAccents(item.bairro.toLowerCase());
                
                return normalizedLogradouro.includes(normalizedQuery) || 
                       normalizedBairro.includes(normalizedQuery);
            });
            
            // Limita a 50 resultados por vez
            return results.slice(0, 50);
        }

        // Renderiza os resultados
        function renderResults(results) {
            const container = document.getElementById('resultsContainer');
            const counter = document.getElementById('resultsCounter');
            const initialMessage = document.getElementById('initialMessage');
            const noResults = document.getElementById('noResults');

            // Limpa o container
            container.innerHTML = '';

            // Esconde mensagem inicial
            initialMessage.classList.add('hidden');

            if (results.length === 0) {
                noResults.classList.remove('hidden');
                counter.textContent = 'Nenhum resultado encontrado';
                return;
            }

            noResults.classList.add('hidden');
            
            const totalResults = results.length;
            const maxShown = 50;
            
            if (totalResults > maxShown) {
                counter.textContent = `Mostrando ${maxShown} de ${totalResults} resultados (refine sua busca para ver mais)`;
            } else {
                counter.textContent = `${totalResults} resultado${totalResults !== 1 ? 's' : ''} encontrado${totalResults !== 1 ? 's' : ''}`;
            }

            // Renderiza os cards
            results.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-lg shadow-md p-3 sm:p-5 hover:shadow-xl active:shadow-lg transition-all duration-200 fade-in mobile-optimized cursor-pointer';
                card.style.animationDelay = `${index * 0.05}s`;
                
                card.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="flex-1 min-w-0">
                            <h3 class="text-sm sm:text-base font-semibold text-gray-900 break-words leading-tight no-underline" style="text-decoration: none; border-bottom: none;">
                                ${item.logradouro}
                            </h3>
                            <p class="text-gray-600 text-xs sm:text-sm mt-1 no-underline" style="text-decoration: none; border-bottom: none;">
                                ${item.bairro}
                            </p>
                        </div>
                        <div class="flex-shrink-0">
                            <div class="inline-block bg-green-600 text-white px-3 sm:px-4 py-2 rounded-md font-mono font-bold text-xs sm:text-sm shadow-sm">
                                ${item.cep}
                            </div>
                        </div>
                    </div>
                `;
                
                // Adiciona feedback de toque no mobile
                card.addEventListener('click', function() {
                    navigator.clipboard.writeText(item.cep).then(() => {
                        const badge = card.querySelector('.bg-green-600');
                        const originalText = badge.textContent;
                        badge.textContent = 'Copiado!';
                        badge.classList.add('bg-blue-600');
                        badge.classList.remove('bg-green-600');
                        setTimeout(() => {
                            badge.textContent = originalText;
                            badge.classList.remove('bg-blue-600');
                            badge.classList.add('bg-green-600');
                        }, 1500);
                    });
                });
                
                container.appendChild(card);
            });
        }

        // Reseta a busca
        function resetSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('resultsContainer').innerHTML = '';
            document.getElementById('resultsCounter').textContent = 'Aguardando busca...';
            document.getElementById('initialMessage').classList.remove('hidden');
            document.getElementById('noResults').classList.add('hidden');
        }

        // ========================================
        // EVENT LISTENERS
        // ========================================
        
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');

        // Busca em tempo real (com debounce)
        let debounceTimer;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                const query = e.target.value;
                if (query.trim()) {
                    const results = searchCEP(query);
                    renderResults(results);
                } else {
                    resetSearch();
                }
            }, 300);
        });

        // Botão limpar
        clearBtn.addEventListener('click', resetSearch);

        // Busca ao pressionar Enter
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const query = e.target.value;
                const results = searchCEP(query);
                renderResults(results);
            }
        });
    </script>
</body>
</html>
